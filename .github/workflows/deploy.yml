name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      REGION: ${{ vars.REGION }}
      REPO: fresh-prints
      SERVICE: fresh-prints
      BUCKET: ${{ vars.PROJECT_ID }}-fresh-prints-db

    steps:
      # vars are mapped via env (not inlined into the script) so values
      # containing quotes cannot break the shell.
      - name: "Preflight: validate required variables"
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          REGION: ${{ vars.REGION }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
          ALLOWED_INVOKER_EMAILS: ${{ vars.ALLOWED_INVOKER_EMAILS }}
          ALLOWED_GITHUB_USERNAMES: ${{ vars.ALLOWED_GITHUB_USERNAMES }}
          DIGEST_EMAIL_TO: ${{ vars.DIGEST_EMAIL_TO }}
          DIGEST_EMAIL_FROM: ${{ vars.DIGEST_EMAIL_FROM }}
          GH_CLIENT_ID: ${{ vars.GH_CLIENT_ID }}
          APP_URL: ${{ vars.APP_URL }}
          CLOUD_RUN_SERVICE_URL: ${{ vars.CLOUD_RUN_SERVICE_URL }}
        run: |
          missing=()
          [ -z "${PROJECT_ID}" ] && missing+=("PROJECT_ID")
          [ -z "${REGION}" ] && missing+=("REGION")
          [ -z "${WIF_PROVIDER}" ] && missing+=("WIF_PROVIDER")
          [ -z "${WIF_SERVICE_ACCOUNT}" ] && missing+=("WIF_SERVICE_ACCOUNT")
          [ -z "${ALLOWED_INVOKER_EMAILS}" ] && missing+=("ALLOWED_INVOKER_EMAILS")
          [ -z "${ALLOWED_GITHUB_USERNAMES}" ] && missing+=("ALLOWED_GITHUB_USERNAMES")
          [ -z "${DIGEST_EMAIL_TO}" ] && missing+=("DIGEST_EMAIL_TO")
          [ -z "${DIGEST_EMAIL_FROM}" ] && missing+=("DIGEST_EMAIL_FROM")
          [ -z "${GH_CLIENT_ID}" ] && missing+=("GH_CLIENT_ID")
          [ -z "${APP_URL}" ] && missing+=("APP_URL")
          [ -z "${CLOUD_RUN_SERVICE_URL}" ] && missing+=("CLOUD_RUN_SERVICE_URL")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Actions VARIABLES (Settings → Secrets and variables → Actions → VARIABLES tab, not Secrets): ${missing[*]}"
            exit 1
          fi
          echo "All required variables present."

      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.PROJECT_ID }}

      - name: Configure Artifact Registry Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}"
          docker build -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}"
          # ^||^ delimiter: ALLOWED_GITHUB_USERNAMES / ALLOWED_INVOKER_EMAILS contain commas
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}:${GITHUB_SHA}" \
            --platform=managed \
            --allow-unauthenticated \
            --max-instances=1 \
            --add-volume=name=db-storage,type=cloud-storage,bucket="${BUCKET}" \
            --add-volume-mount=volume=db-storage,mount-path=/data \
            --set-secrets=ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,SESSION_SECRET=SESSION_SECRET:latest,GH_CLIENT_SECRET=GH_CLIENT_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest \
            --update-env-vars="^||^NODE_ENV=production||GH_CLIENT_ID=${{ vars.GH_CLIENT_ID }}||ALLOWED_GITHUB_USERNAMES=${{ vars.ALLOWED_GITHUB_USERNAMES }}||ALLOWED_INVOKER_EMAILS=${{ vars.ALLOWED_INVOKER_EMAILS }}||DIGEST_EMAIL_TO=${{ vars.DIGEST_EMAIL_TO }}||DIGEST_EMAIL_FROM=${{ vars.DIGEST_EMAIL_FROM }}||APP_URL=${{ vars.APP_URL }}||CLOUD_RUN_SERVICE_URL=${{ vars.CLOUD_RUN_SERVICE_URL }}"
