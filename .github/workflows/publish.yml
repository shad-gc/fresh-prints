name: Publish

on:
  schedule:
    # 13:00 UTC ≈ 6am PDT (accept 1h winter drift)
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      edition_date:
        description: 'Optional YYYY-MM-DD to (re)publish a specific date'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.CLOUD_RUN_SERVICE_URL }}
          # Mandatory: without the email claim, the app's caller pinning
          # (ALLOWED_INVOKER_EMAILS) rejects the token.
          id_token_include_email: true

      - name: Call /api/publish with identity token
        env:
          SERVICE_URL: ${{ vars.CLOUD_RUN_SERVICE_URL }}
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
          EDITION_DATE: ${{ inputs.edition_date }}
        run: |
          set -euo pipefail
          echo "::add-mask::${ID_TOKEN}"
          # Exact URL, no trailing slash (must match the token audience)
          SERVICE_URL="${SERVICE_URL%/}"

          BODY='{}'
          if [[ -n "${EDITION_DATE}" ]]; then
            BODY="$(jq -cn --arg d "${EDITION_DATE}" '{edition_date:$d}')"
          fi

          HTTP_CODE="$(curl -sS -o /tmp/publish-body.json -w '%{http_code}' \
            -X POST "${SERVICE_URL}/api/publish" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${BODY}")"
          if [[ "${HTTP_CODE}" != "200" ]]; then
            echo "publish failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
          echo "publish ok (HTTP ${HTTP_CODE})"
