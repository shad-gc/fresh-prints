name: Publish

on:
  schedule:
    # 13:00 UTC ≈ 6am PDT (accept 1h winter drift)
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      edition_date:
        description: 'Optional YYYY-MM-DD to (re)publish a specific date'
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # vars are mapped via env (not inlined into the script) so values
      # containing quotes cannot break the shell.
      - name: "Preflight: validate required variables"
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
          CLOUD_RUN_SERVICE_URL: ${{ vars.CLOUD_RUN_SERVICE_URL }}
        run: |
          missing=()
          [ -z "${PROJECT_ID}" ] && missing+=("PROJECT_ID")
          [ -z "${WIF_PROVIDER}" ] && missing+=("WIF_PROVIDER")
          [ -z "${WIF_SERVICE_ACCOUNT}" ] && missing+=("WIF_SERVICE_ACCOUNT")
          [ -z "${CLOUD_RUN_SERVICE_URL}" ] && missing+=("CLOUD_RUN_SERVICE_URL")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Actions VARIABLES (Settings → Secrets and variables → Actions → VARIABLES tab, not Secrets): ${missing[*]}"
            exit 1
          fi
          case "${CLOUD_RUN_SERVICE_URL}" in
            */) echo "::error::CLOUD_RUN_SERVICE_URL must not end with a trailing slash — the ID token audience must exactly match the app's normalized URL."; exit 1 ;;
          esac
          echo "All required variables present."

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.CLOUD_RUN_SERVICE_URL }}
          # Mandatory: without the email claim, the app's caller pinning
          # (ALLOWED_INVOKER_EMAILS) rejects the token.
          id_token_include_email: true

      - name: Call /api/publish with identity token
        env:
          SERVICE_URL: ${{ vars.CLOUD_RUN_SERVICE_URL }}
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
          EDITION_DATE: ${{ inputs.edition_date }}
        run: |
          set -euo pipefail
          echo "::add-mask::${ID_TOKEN}"
          # Exact URL, no trailing slash (must match the token audience)
          SERVICE_URL="${SERVICE_URL%/}"

          BODY='{}'
          if [[ -n "${EDITION_DATE}" ]]; then
            BODY="$(jq -cn --arg d "${EDITION_DATE}" '{edition_date:$d}')"
          fi

          HTTP_CODE="$(curl -sS -o /tmp/publish-body.json -w '%{http_code}' \
            -X POST "${SERVICE_URL}/api/publish" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${BODY}")"
          if [[ "${HTTP_CODE}" != "200" ]]; then
            echo "publish failed with HTTP ${HTTP_CODE}"
            # Surface only the API's error field, truncated — logs are public.
            # (The 2026-08-07 run failed with a bare HTTP 500 and needed a
            # re-dispatch just to diagnose; this makes the cause visible.)
            ERR="$(jq -r '.error // empty' /tmp/publish-body.json 2>/dev/null | head -c 400 || true)"
            echo "server error: ${ERR:-"(no error field / non-JSON response)"}"
            exit 1
          fi
          echo "publish ok (HTTP ${HTTP_CODE})"

      # A red run is silent unless someone is watching the Actions tab — the
      # Aug 30 failure ate an edition without anyone noticing until the 31st.
      - name: Alert on failure (GitHub issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Same discipline as the log output: only the API's error field,
          # truncated — issues on this repo are public.
          ERR="$(jq -r '.error // empty' /tmp/publish-body.json 2>/dev/null | head -c 400 || true)"
          TITLE="Publish failed: $(date -u +%F)"
          BODY="$(printf 'Scheduled publish failed.\n\nRun: %s\n\nServer error: %s\n' "${RUN_URL}" "${ERR:-"(no error field / non-JSON response)"}")"
          gh label create publish-failure --repo "${REPO}" --color D93F0B \
            --description "Automated: scheduled publish failed" --force || true
          EXISTING="$(gh issue list --repo "${REPO}" --label publish-failure --state open --json number --jq '.[0].number // empty')"
          if [[ -n "${EXISTING}" ]]; then
            gh issue comment "${EXISTING}" --repo "${REPO}" --body "${BODY}"
          else
            gh issue create --repo "${REPO}" --title "${TITLE}" --body "${BODY}" --label publish-failure
          fi
