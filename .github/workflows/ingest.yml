name: Ingest

on:
  schedule:
    # Hourly
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.CLOUD_RUN_SERVICE_URL }}
          # Mandatory: without the email claim, the app's caller pinning
          # (ALLOWED_INVOKER_EMAILS) rejects the token.
          id_token_include_email: true

      - name: Call /api/ingest with identity token
        env:
          SERVICE_URL: ${{ vars.CLOUD_RUN_SERVICE_URL }}
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          echo "::add-mask::${ID_TOKEN}"
          # Exact URL, no trailing slash (must match the token audience)
          SERVICE_URL="${SERVICE_URL%/}"
          HTTP_CODE="$(curl -sS -o /tmp/ingest-body.json -w '%{http_code}' \
            -X POST "${SERVICE_URL}/api/ingest" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -H "Content-Type: application/json")"
          if [[ "${HTTP_CODE}" != "200" ]]; then
            echo "ingest failed with HTTP ${HTTP_CODE}"
            # Do not dump body — may contain titles/URLs; keep logs safe on a public repo
            exit 1
          fi
          echo "ingest ok (HTTP ${HTTP_CODE})"
